# Community 50 - Eutopia Browser and EP&N eApps
# Only entries with `live: true` are loaded and discoverable in the live browser.
# Plain string entries (legacy format) are not live-gated and will be skipped.

- organisation: ethos_browser
  brand:
    id: evo
    community-code: 50
    display-name: EVO Browser
    product-name: EVO Browser
    window-title: EVO Browser
    logo: lib/assets/ethosverse-browser-logo-v3-transparent.png
    home-app: evo_dl
    launch-environment: com.50gramx.50.ethos_browser.*
    # THE BRAND'S PUBLIC FACE on the releases page (50gramx.github.io/
    # eapp-releases): what it is, where else it lives, and who may try it.
    #   access: alpha (early trials), beta (testing), gamma (an organisation,
    #           delivered privately through its own gramx store)
    #   distribution: public (stores and downloads) or private (gramx store only)
    #   website / play-store / app-store / testflight / mac-app-store /
    #   microsoft-store: listed only once they are public.
    #   category, description, developer, privacy-policy, terms, support:
    #           the store facts. Any of them left out is taken from the
    #           publisher (src/main/contracts/publisher.yaml) unless
    #           publisher-defaults: off.
    #   data-safety: the store's own data-safety page, linked as it stands.
    #   screenshots: images (paths under the releases site, or https URLs),
    #           comma separated; video: one https video (mp4/webm or a
    #           YouTube link). Screens captured automatically from the web
    #           app are added after these.
    #   age-rating + rating-authority: only a rating someone issued (the IARC
    #           questionnaire in Play Console or App Store Connect), never
    #           self-assigned; without one the page says "not yet rated".
    site:
      summary: "The EVO browser, and GramX: the live world. Every Ethos eApp in one app."
      category: Tools
      developer: 50GRAMx
      age-rating: "3+"
      rating-authority: "IARC, via Google Play"
      interactive-elements: Users interact
      description: "A browser that keeps what you do on your own side: one search across several engines, trackers blocked before they load, your spaces and your neighbourhood (Mohalla Map, by pincode), and every Ethos eApp in one place. GramX, the live world, opens from the same app."
      data-safety: https://play.google.com/store/apps/datasafety?id=com.fiftygramx.ethosai
      website: https://live.50gramx.com
      play-store: https://play.google.com/store/apps/details?id=com.fiftygramx.ethosai
      access: alpha beta gamma
      distribution: public
    ios:
      # The App Store Connect record "50GRAMX" (Apple id 1571003338) already
      # owns this bundle id, and it is the Android package this app shipped
      # under before brands. An Apple bundle id may not contain "_", so the
      # launch-environment cannot be used here.
      bundle-id: com.fiftygramx.ethosai
      team-id: V9YYYP7GU9
      # The name under the icon on iPhone and iPad: the App Store record's.
      display-name: GramX
    runtime:
      session-file: evo_session.json
      singleton-name: 50gramx_evo_singleton
    windows:
      binary-name: eapp_live
      installer-output-name: EvoSetup
      installer-default-dir: EvoBrowser
      window-title: EVO Browser
      product-name: EVO Browser
      company-name: 50GRAMx
      file-description: EVO Browser
      internal-name: eapp_live
      original-filename: eapp_live.exe
      legal-copyright: Copyright (C) 2026 50GRAMx. All rights reserved.
      icon: resources\\app_icon.ico
    web:
      # live.50gramx.com is served by the `bharatsphere-app` Hosting site, which
      # lives in the IDENTITY project (bharatsphere-183e7). The domain stays
      # where it is: Google sign-in redirects to
      # https://live.50gramx.com/__/auth/handler, and that reserved path only
      # answers when the site sits in the project that owns Auth. Hosting the
      # evo build anywhere else would mean a redirect_uri_mismatch or a domain
      # re-verification; this way it is one deploy target change and no DNS.
      #
      # One build serves every brand: with no BRAND_ID the bundle is the evo
      # browser, and main.dart turns a /<community>/<org>/<app> URL into the
      # launch environment com.50gramx.<community>.<org>.<app>. Other brands are
      # opened by address on this same domain -- nothing per-brand is built.
      firebase-project: bharatsphere-183e7
      firebase-site: bharatsphere-app
      # `live` = the production channel that serves live.50gramx.com. Other
      # brands omit this and deploy to a per-brand preview channel.
      firebase-channel: live
      url: https://live.50gramx.com
  apps:
    - name: evo_dl
      live: true
    - name: evo_privacy
      live: true
    - name: evo_history
      live: true
    - name: evo_wasm
      live: true
    - name: evo_pods
      live: true
    - name: evo_llm
      live: true
    - name: evo_mail
      live: true

# EP&N DePIN node platform — its own organisation so the dashboard's
# org-solution shell scopes the ten eApps as one product, distinct from the
# browser (evo_*) apps.
- organisation: epn
  brand:
    id: epn
    community-code: 50
    display-name: EP&N
    product-name: EP&N Node
    window-title: EP&N Node
    # Placeholder: no dedicated EP&N logo asset exists/bundles yet, so point at
    # the default bundled logo to avoid a broken image. Replace with
    # lib/assets/brands/epn/logo.png once that asset is added to pubspec assets.
    logo: lib/assets/ethosverse-browser-logo-v3-transparent.png
    home-app: epn_home
    launch-environment: com.50gramx.50.epn.*
    site:
      summary: "Run a gram: share your machine's compute on the EP&N network and see what it earns."
      category: Tools
      developer: 50GRAMx
      description: "EP&N Node runs a gram on your machine. It joins the EP&N network, does work for other people when your machine is free, meters every unit of it, and shows what it earned. Using your own machine costs you nothing; you are paid only when others use it."
      website: https://50gramx.com
      access: alpha beta gamma
      distribution: public
    ios:
      # iPhone and iPad. The bundle id is the brand's store identity by the
      # usual nomenclature -- its Android applicationId,
      # com.fiftygramx.fifty.zero.epn -- so none is named here. TestFlight takes the build once
      # App Store Connect has an app record for that id; until then the upload
      # step fails and the next scheduled build tries again.
      team-id: V9YYYP7GU9
    runtime:
      session-file: epn_session.json
      singleton-name: 50gramx_epn_singleton
    windows:
      binary-name: epn_node
      installer-output-name: EpnNodeSetup
      installer-default-dir: EpnNode
      window-title: EP&N Node
      product-name: EP&N Node
      company-name: 50GRAMx
      file-description: EP&N Node
      internal-name: epn_node
      original-filename: epn_node.exe
      legal-copyright: Copyright (C) 2026 50GRAMx. All rights reserved.
      icon: resources\\app_icon.ico
    surface:
      tiles:
        app-library: false
        private-space: false
        history: false
        pane-switcher: false
        spotlight: false
        open-tabs-summary: false
        open-communities-summary: false
        user-details: false
      open-pages:
        page-tabs: false
        clear-session-on-start: true
      solution-nav:
        unbounded: true
      wallpaper:
        preferred: mesh
        show-credit: false
      app-selector:
        auto-visible: false
      browser:
        # EP&N is a node app, not a browser — never prompt to become the OS
        # default browser.
        show-default-prompt: false
    sidecars:
      epnd: true
  apps:
    - name: epn_home
      live: true
    - name: epn_agent_chat
      live: true
    - name: epn_node
      live: true
    - name: epn_peers
      live: true
    - name: epn_wallet
      live: true
    - name: epn_deployments
      live: true
    - name: epn_metering
      live: true
    - name: epn_settings
      live: true
    - name: epn_market
      live: true
    - name: epn_circle
      live: true

