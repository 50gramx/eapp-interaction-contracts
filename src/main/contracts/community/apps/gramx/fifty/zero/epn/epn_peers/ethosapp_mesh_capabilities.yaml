# Mesh capability proof surface for the peer network app.
# These are generated into protobuf services and consumed by polyglot clients.
- name-code: EAMC7101
  name: Mesh Load Identity
  mesh:
    context: discover
    method: EAMC7101
    expecting: EAMV7100
    returns: EAMV7101

- name-code: EAMC7102
  name: Mesh Load Peers
  mesh:
    context: discover
    method: EAMC7102
    expecting: EAMV7100
    returns: EAMV7103

- name-code: EAMC7103
  name: Mesh Connect Peer
  mesh:
    context: discover
    method: EAMC7103
    expecting: EAMV7104
    returns: EAMV7105

- name-code: EAMC7104
  name: Mesh Find Peer by DID
  mesh:
    context: discover
    method: EAMC7104
    expecting: EAMV7106
    returns: EAMV7107



# ── WHAT THE NETWORK CAN DO ──────────────────────────────────────────────────

# EAMC7105 - every model serving now: on the person's grams, seats, the network.
- name-code: EAMC7105
  name: List Models
  mesh:
    context: discover
    method: EAMC7105
    expects: EAMV7108
    returns: EAMV7109

# EAMC7106 - the specialists (operators with a persona) on this gram.
- name-code: EAMC7106
  name: List Specialists
  mesh:
    context: discover
    method: EAMC7106
    expects: EAMV7110
    returns: EAMV7111
