# ── OPERATORS, ACROSS YOUR GRAMS ─────────────────────────────────────────────

# EAMV9001 - Fleet Request.
- name-code: EAMV9001
  name: Fleet Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT9001
      name: scope
      type: ELVT1007
      default: ""

# EAMV9002 - every operator on every one of your grams: a summary, counts {label, value}, the work running, waiting, done and failed {title, subtitle, trailing}, and each operator with the grams it is on.
- name-code: EAMV9002
  name: Fleet Operators
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT9002
      name: summary
      type: ELVT1007
      default: ""
    - name-code: EAMVT9003
      name: counts
      type: ELVT1018
      default: []
    - name-code: EAMVT9004
      name: running
      type: ELVT1018
      default: []
    - name-code: EAMVT9005
      name: waiting
      type: ELVT1018
      default: []
    - name-code: EAMVT9006
      name: done
      type: ELVT1018
      default: []
    - name-code: EAMVT9007
      name: failed
      type: ELVT1018
      default: []
    - name-code: EAMVT9008
      name: operators
      type: ELVT1018
      default: []

# ── GROWTH: WHO CAME TO THE SITE, AND WHAT THEY DID ─────────────────────────

# EAMV9003 - Growth Request.
- name-code: EAMV9003
  name: Growth Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT9010
      name: scope
      type: ELVT1007
      default: ""

# EAMV9004 - the site's visits as this gram counts them: a summary, where visitors came from and which kinds of page they saw {label, value}, the top pages and the last hour {title, subtitle, trailing}, and the weekly report.
- name-code: EAMV9004
  name: Growth
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT9011
      name: summary
      type: ELVT1007
      default: ""
    - name-code: EAMVT9012
      name: sources
      type: ELVT1018
      default: []
    - name-code: EAMVT9013
      name: kinds
      type: ELVT1018
      default: []
    - name-code: EAMVT9014
      name: pages
      type: ELVT1018
      default: []
    - name-code: EAMVT9015
      name: last_hour
      type: ELVT1018
      default: []
    - name-code: EAMVT9016
      name: report
      type: ELVT1007
      default: ""
