# EAMV11001 - Turns Request: which turns ("" = the last two days).
- name-code: EAMV11001
  name: Turns Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT11001
      name: scope
      type: ELVT1007
      default: ""

# EAMV11002 - Turns: rows {id, title, subtitle, trailing} -- id is the turn
# id, so a tapped row opens it -- and a one-line summary.
- name-code: EAMV11002
  name: Turns
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT11002
      name: turns
      type: ELVT1018
      default: []
    - name-code: EAMVT11003
      name: summary
      type: ELVT1007
      default: ""
    # Per day: {label, own, seat, network} steps -- where the work ran.
    - name-code: EAMVT11008
      name: days
      type: ELVT1018
      default: []
    # The same, as parts of the whole: {label, value}.
    - name-code: EAMVT11009
      name: where
      type: ELVT1018
      default: []
    # Per day: {label, value} US dollars paid outside (seats, providers).
    - name-code: EAMVT11010
      name: outside_by_day
      type: ELVT1018
      default: []
    # Tiles in fixed order: [steps today, vCPU-s today, paid outside today,
    # steps in 7 days], each {label, value}.
    - name-code: EAMVT11011
      name: tiles
      type: ELVT1018
      default: []

# EAMV11003 - Turn Request.
- name-code: EAMV11003
  name: Turn Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT11004
      name: turn_id
      type: ELVT1007
      default: ""

# EAMV11004 - Turn: a title, one row per step {title, subtitle, trailing},
# and the turn's totals.
- name-code: EAMV11004
  name: Turn
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT11005
      name: title
      type: ELVT1007
      default: ""
    - name-code: EAMVT11006
      name: steps
      type: ELVT1018
      default: []
    - name-code: EAMVT11007
      name: summary
      type: ELVT1007
      default: ""

# ── WHAT EACH OPERATOR USED, ACROSS THE PERSON'S GRAMS AND BRANDS (17 Nov) ──
# EAMV11005 - Usage Request. scope: "" = the scope this gram keeps for the
# person; "gram:<did>", "mine" (all the person's grams) or "gramx:<id>" (a
# brand: its grams). operator: drill into one operator ("" = all). set: "yes"
# keeps this scope as the person's, so every page follows it.
- name-code: EAMV11005
  name: Usage Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT11020
      name: scope
      type: ELVT1007
      default: ""
    - name-code: EAMVT11021
      name: operator
      type: ELVT1007
      default: ""
    - name-code: EAMVT11022
      name: set
      type: ELVT1007
      default: ""

# EAMV11006 - Usage: one scope's usage, summed over its grams.
- name-code: EAMV11006
  name: Usage
  type: ELVT1021
  modelled: true
  properties:
    # What is shown: "All my grams (5)", "50gramx.com (6 grams)".
    - name-code: EAMVT11023
      name: scope_label
      type: ELVT1007
      default: ""
    # The scopes to pick from: rows {id, title, subtitle, trailing}.
    - name-code: EAMVT11024
      name: scopes
      type: ELVT1018
      default: []
    # The scope in sentences, and what changed or is wrong.
    - name-code: EAMVT11025
      name: summary
      type: ELVT1007
      default: ""
    - name-code: EAMVT11026
      name: insights
      type: ELVT1007
      default: ""
    # Tiles: [jobs today, interrupted this week, served this week, stored now], {label, value}.
    - name-code: EAMVT11027
      name: tiles
      type: ELVT1018
      default: []
    # Operators: rows {id, title, subtitle, trailing}; a tapped row drills in.
    - name-code: EAMVT11028
      name: operators
      type: ELVT1018
      default: []
    # Per day, 14 days: {label, done, failed, interrupted} jobs.
    - name-code: EAMVT11029
      name: job_days
      type: ELVT1018
      default: []
    # Per day, 14 days: {label, value} GB served.
    - name-code: EAMVT11030
      name: served_days
      type: ELVT1018
      default: []
    # Per gram: {label, value} GB served this week (chart) ...
    - name-code: EAMVT11031
      name: by_gram
      type: ELVT1018
      default: []
    # ... and the grams as rows {id, title, subtitle, trailing}: answered or not.
    - name-code: EAMVT11032
      name: grams
      type: ELVT1018
      default: []
    # Per operator: {label, value} job hours this week.
    - name-code: EAMVT11033
      name: by_operator
      type: ELVT1018
      default: []
    # Recent jobs: rows {id, title, subtitle, trailing}, newest first.
    - name-code: EAMVT11034
      name: jobs
      type: ELVT1018
      default: []
    # The operator drilled into ("" = all).
    - name-code: EAMVT11035
      name: operator
      type: ELVT1007
      default: ""
