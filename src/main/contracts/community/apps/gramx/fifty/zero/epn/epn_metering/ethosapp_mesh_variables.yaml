# EAMV11001 - Turns Request: which turns ("" = the last two days).
- name-code: EAMV11001
  name: Turns Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT11001
      name: scope
      type: ELVT1007
      default: ""

# EAMV11002 - Turns: rows {id, title, subtitle, trailing} -- id is the turn
# id, so a tapped row opens it -- and a one-line summary.
- name-code: EAMV11002
  name: Turns
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT11002
      name: turns
      type: ELVT1018
      default: []
    - name-code: EAMVT11003
      name: summary
      type: ELVT1007
      default: ""
    # Per day: {label, own, seat, network} steps -- where the work ran.
    - name-code: EAMVT11008
      name: days
      type: ELVT1018
      default: []
    # The same, as parts of the whole: {label, value}.
    - name-code: EAMVT11009
      name: where
      type: ELVT1018
      default: []
    # Per day: {label, value} US dollars paid outside (seats, providers).
    - name-code: EAMVT11010
      name: outside_by_day
      type: ELVT1018
      default: []
    # Tiles in fixed order: [steps today, vCPU-s today, paid outside today,
    # steps in 7 days], each {label, value}.
    - name-code: EAMVT11011
      name: tiles
      type: ELVT1018
      default: []

# EAMV11003 - Turn Request.
- name-code: EAMV11003
  name: Turn Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT11004
      name: turn_id
      type: ELVT1007
      default: ""

# EAMV11004 - Turn: a title, one row per step {title, subtitle, trailing},
# and the turn's totals.
- name-code: EAMV11004
  name: Turn
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT11005
      name: title
      type: ELVT1007
      default: ""
    - name-code: EAMVT11006
      name: steps
      type: ELVT1018
      default: []
    - name-code: EAMVT11007
      name: summary
      type: ELVT1007
      default: ""
