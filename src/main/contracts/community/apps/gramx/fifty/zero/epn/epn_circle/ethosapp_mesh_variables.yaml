
# ── YOUR GRAMX, FROM THE GRAM ───────────────────────────────────────────────

# EAMV15001 - Gramx Request.
- name-code: EAMV15001
  name: Gramx Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15001
      name: scope
      type: ELVT1007
      default: ""

# EAMV15002 - your gramx rooms {title, subtitle, trailing}, the grams in your home gramx {title, subtitle, trailing}, a summary, and online/offline {label, value}.
- name-code: EAMV15002
  name: Gramx
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15002
      name: rooms
      type: ELVT1018
      default: []
    - name-code: EAMVT15003
      name: members
      type: ELVT1018
      default: []
    - name-code: EAMVT15004
      name: summary
      type: ELVT1007
      default: ""
    - name-code: EAMVT15005
      name: online
      type: ELVT1018
      default: []

# ── ONE GRAMX, OPENED ─────────────────────────────────────────────────────────

# EAMV15003 - which gramx to open.
- name-code: EAMV15003
  name: Open Gramx Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15006
      name: gramx_id
      type: ELVT1007
      default: ""

# EAMV15004 - one gramx: its name, a summary, its grams, what was said in it lately, the keys and accounts it holds (never their values: what each is for, who may use it, created, expiry, rotation), for the foundation gramx the requests on its desk {id, title, subtitle, trailing}, this gram's role in it, its domains (state in words and the records to add), its routes and its sites, and how far the gramx's state has reached its member grams (a summary, and one row per member gram).
- name-code: EAMV15004
  name: One Gramx
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15007
      name: title
      type: ELVT1007
      default: ""
    - name-code: EAMVT15008
      name: summary
      type: ELVT1007
      default: ""
    - name-code: EAMVT15009
      name: members
      type: ELVT1018
      default: []
    - name-code: EAMVT15010
      name: posts
      type: ELVT1018
      default: []
    - name-code: EAMVT15011
      name: desk
      type: ELVT1018
      default: []
    - name-code: EAMVT15016
      name: keys
      type: ELVT1018
      default: []
    - name-code: EAMVT15017
      name: rank
      type: ELVT1007
      default: ""
    - name-code: EAMVT15018
      name: domains
      type: ELVT1018
      default: []
    - name-code: EAMVT15019
      name: routes
      type: ELVT1018
      default: []
    - name-code: EAMVT15020
      name: sites
      type: ELVT1018
      default: []
    - name-code: EAMVT15025
      name: sync_summary
      type: ELVT1007
      default: ""
    - name-code: EAMVT15026
      name: sync
      type: ELVT1018
      default: []

# EAMV15005 - take one foundation request to its next stage (approve the request, approve the output, release), signed by you.
- name-code: EAMV15005
  name: Advance Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15012
      name: gramx_id
      type: ELVT1007
      default: ""
    - name-code: EAMVT15013
      name: shape
      type: ELVT1007
      default: ""

# EAMV15006 - what to say, and in which gramx (empty = your home gramx).
- name-code: EAMV15006
  name: Say In Gramx
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15014
      name: gramx_id
      type: ELVT1007
      default: ""
    - name-code: EAMVT15015
      name: text
      type: ELVT1007
      default: ""

# EAMV15007 - one change to what the gramx owns, made by this gram with its own membership and role.
# action is one of:
#   domain-add (arg = host), domain-remove (arg = host),
#   route (arg = host or host/path, arg2 = site), unroute (arg = host or host/path),
#   key-create (arg = platform, arg2 = scope), key-rotate (arg = key id), key-revoke (arg = key id),
#   site-source (arg = site, arg2 = the build's address), move-site (arg = one of this gram's own sites, arg2 = name in the gramx).
- name-code: EAMV15007
  name: Gramx Action
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15021
      name: gramx_id
      type: ELVT1007
      default: ""
    - name-code: EAMVT15022
      name: action
      type: ELVT1007
      default: ""
    - name-code: EAMVT15023
      name: arg
      type: ELVT1007
      default: ""
    - name-code: EAMVT15024
      name: arg2
      type: ELVT1007
      default: ""
