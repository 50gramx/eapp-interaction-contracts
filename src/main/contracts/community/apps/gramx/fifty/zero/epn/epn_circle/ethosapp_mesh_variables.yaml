
# ── YOUR GRAMX, FROM THE GRAM ───────────────────────────────────────────────

# EAMV15001 - Gramx Request.
- name-code: EAMV15001
  name: Gramx Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15001
      name: scope
      type: ELVT1007
      default: ""

# EAMV15002 - your gramx rooms {title, subtitle, trailing}, the grams in your home gramx {title, subtitle, trailing}, a summary, and online/offline {label, value}.
- name-code: EAMV15002
  name: Gramx
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15002
      name: rooms
      type: ELVT1018
      default: []
    - name-code: EAMVT15003
      name: members
      type: ELVT1018
      default: []
    - name-code: EAMVT15004
      name: summary
      type: ELVT1007
      default: ""
    - name-code: EAMVT15005
      name: online
      type: ELVT1018
      default: []

# ── ONE GRAMX, OPENED ─────────────────────────────────────────────────────────

# EAMV15003 - which gramx to open.
- name-code: EAMV15003
  name: Open Gramx Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15006
      name: gramx_id
      type: ELVT1007
      default: ""

# EAMV15004 - one gramx: its name, a summary, its grams, what was said in it lately, and -- for the foundation gramx -- the requests on its desk {id, title, subtitle, trailing}.
- name-code: EAMV15004
  name: One Gramx
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15007
      name: title
      type: ELVT1007
      default: ""
    - name-code: EAMVT15008
      name: summary
      type: ELVT1007
      default: ""
    - name-code: EAMVT15009
      name: members
      type: ELVT1018
      default: []
    - name-code: EAMVT15010
      name: posts
      type: ELVT1018
      default: []
    - name-code: EAMVT15011
      name: desk
      type: ELVT1018
      default: []

# EAMV15005 - take one foundation request to its next stage (approve the request, approve the output, release), signed by you.
- name-code: EAMV15005
  name: Advance Request
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15012
      name: gramx_id
      type: ELVT1007
      default: ""
    - name-code: EAMVT15013
      name: shape
      type: ELVT1007
      default: ""

# EAMV15006 - what to say, and in which gramx (empty = your home gramx).
- name-code: EAMV15006
  name: Say In Gramx
  type: ELVT1021
  modelled: true
  properties:
    - name-code: EAMVT15014
      name: gramx_id
      type: ELVT1007
      default: ""
    - name-code: EAMVT15015
      name: text
      type: ELVT1007
      default: ""
