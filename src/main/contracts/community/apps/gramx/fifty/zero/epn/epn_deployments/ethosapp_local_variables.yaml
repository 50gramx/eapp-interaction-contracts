# Live deployment list — streams from epnd every 5 s.
- name-code: EAIV9001
  name: Deployments
  type: ELVT1020
  default:
    platform-stream: epn.deployments.list

# Available AI personas — [{id, name, role, deployment_id, is_concierge}].
- name-code: EAIV9002
  name: Personas
  type: ELVT1020
  default: []

# TextEditingController for the operator ID to install.
- name-code: EAIV9003
  name: Install Operator ID Controller
  type: ELVT1001
  default: {}

# TextEditingController for the deployment ID to spin up/down.
- name-code: EAIV9004
  name: Target Deployment ID Controller
  type: ELVT1001
  default: {}

# Result of the last install/spinup/spindown action.
- name-code: EAIV9005
  name: Action Result
  type: ELVT1007
  default: ""

# Log output for the selected deployment (last N lines).
- name-code: EAIV9006
  name: Deployment Logs
  type: ELVT1007
  default: ""

# TextEditingController for a marketplace package CID to install (epn_market post -> CID).
- name-code: EAIV9007
  name: Install Package CID Controller
  type: ELVT1001
  default: {}

# Request for EAMC9001.
- name-code: EAIV9008
  name: Fleet Request
  type: ELVT1021
  modelled: true
  default: {}

# EAMC9001's answer.
- name-code: EAIV9009
  name: Fleet Operators
  type: ELVT1021
  modelled: true
  default: {}

# Request for EAMC9002.
- name-code: EAIV9010
  name: Growth Request
  type: ELVT1021
  modelled: true
  default: {}

# EAMC9002's answer.
- name-code: EAIV9011
  name: Growth
  type: ELVT1021
  modelled: true
  default: {}

# Request for EAMC9003.
- name-code: EAIV9012
  name: Sites Request
  type: ELVT1021
  modelled: true
  default: {}

# EAMC9003's answer.
- name-code: EAIV9013
  name: Sites
  type: ELVT1021
  modelled: true
  default: {}

# Request for EAMC9004 / EAMC9007.
- name-code: EAIV9014
  name: Site Request
  type: ELVT1021
  modelled: true
  default: {}

# The open site (EAMC9004, 9005, 9006, 9007).
- name-code: EAIV9015
  name: Site
  type: ELVT1021
  modelled: true
  default: {}

# The domain being added.
- name-code: EAIV9016
  name: Domain Text
  type: ELVT1007
  default: ""

# Request for EAMC9005 / EAMC9006.
- name-code: EAIV9017
  name: Domain Request
  type: ELVT1021
  modelled: true
  default: {}

# The domain picked in the list (to remove).
- name-code: EAIV9018
  name: Picked Domain
  type: ELVT1007
  default: ""

# The monthly limit being set, in GB.
- name-code: EAIV9019
  name: Cap Text
  type: ELVT1007
  default: ""

# Request for EAMC9008.
- name-code: EAIV9020
  name: Cap Request
  type: ELVT1021
  modelled: true
  default: {}
