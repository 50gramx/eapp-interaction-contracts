# ── THE GRAMS, FROM THE GRAM ──────────────────────────────────────────────

# EAMC14001 - every gram on the person's account, live.
- name-code: EAMC14001
  name: List Grams
  mesh:
    context: discover
    method: EAMC14001
    expects: EAMV14001
    returns: EAMV14002

# EAMC14002 - this gram's mode and each resource: lent, used, kept.
- name-code: EAMC14002
  name: This Gram
  mesh:
    context: discover
    method: EAMC14002
    expects: EAMV14003
    returns: EAMV14004

# EAMC14003 - each gram's network: links, doors open from outside, whether it serves names, its address, what to open.
- name-code: EAMC14003
  name: Network
  mesh:
    context: discover
    method: EAMC14003
    expects: EAMV14005
    returns: EAMV14006

# EAMC14004 - turn a gram's edge duty on or off (the owner's choice; on by default); answers with the network again.
- name-code: EAMC14004
  name: Set Edge Duty
  mesh:
    context: discover
    method: EAMC14004
    expects: EAMV14007
    returns: EAMV14006

# EAMC14005 - set the most a gram's object store may hold (the owner's choice; learned from the disk by default); answers with the network again.
- name-code: EAMC14005
  name: Set Store Ceiling
  mesh:
    context: discover
    method: EAMC14005
    expects: EAMV14008
    returns: EAMV14006
