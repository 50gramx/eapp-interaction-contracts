# Load deployments + personas on page appear.
- name-code: EALC9001
  name: Init Page
  context:
    steps:
      - command: platform-invoke
        handler: epn.agent.personas
        assign-to: EAIV9002
      - command: mesh-invoke
        capability: EAMC9001
        request: EAIV9008
        assign-to: EAIV9009

# Return the operator ID TextEditingController.
- name-code: EALC9002
  name: Get Install Controller
  context:
    returns:
      type: ELVT1001
    steps:
      - command: return
        value: EAIV9003

# Return the deployment ID TextEditingController.
- name-code: EALC9003
  name: Get Target Controller
  context:
    returns:
      type: ELVT1001
    steps:
      - command: return
        value: EAIV9004

# Install an operator from the operator ID in EAIV9003, or by package CID
# (EAIV9007) if the operator ID field is left blank — resolved via the
# marketplace package distributor on the daemon side.
- name-code: EALC9004
  name: Install Operator
  context:
    steps:
      - command: platform-invoke
        handler: epn.deployments.install
        params:
          operator_id: EAIV9003
          cid: EAIV9007
        assign-to: EAIV9005

# Return the package CID TextEditingController.
- name-code: EALC9008
  name: Get Install CID Controller
  context:
    returns:
      type: ELVT1001
    steps:
      - command: return
        value: EAIV9007

# Spin up the deployment ID in EAIV9004.
- name-code: EALC9005
  name: Spin Up
  context:
    steps:
      - command: platform-invoke
        handler: epn.deployments.spinup
        params:
          deployment_id: EAIV9004
        assign-to: EAIV9005

# Spin down the deployment ID in EAIV9004.
- name-code: EALC9006
  name: Spin Down
  context:
    steps:
      - command: platform-invoke
        handler: epn.deployments.spindown
        params:
          deployment_id: EAIV9004
        assign-to: EAIV9005

# Fetch recent logs for the deployment ID in EAIV9004.
- name-code: EALC9007
  name: Fetch Logs
  context:
    steps:
      - command: platform-invoke
        handler: epn.deployments.logs_snapshot
        params:
          deployment_id: EAIV9004
          tail_lines: 50
        assign-to: EAIV9006

# Pre-fill the Target Deployment ID field when a row is tapped in the deployments list.
# The engine extracts the tapped deployment's fields and passes them separately.
- name-code: EALC9009
  name: Select Deployment
  context:
    expects:
      - id: ELVT1007
      - name: ELVT1007
      - status: ELVT1007
      - operator_id: ELVT1007
    steps:
      - command: set-text-controller
        controller: EAIV9004
        value: id

# The board: the same answer, opened on its own page.
- name-code: EALC9010
  name: Load Fleet Board
  context:
    steps:
      - command: mesh-invoke
        capability: EAMC9001
        request: EAIV9008
        assign-to: EAIV9009

# The growth board, loaded each time its page appears.
- name-code: EALC9011
  name: Load Growth Board
  context:
    steps:
      - command: mesh-invoke
        capability: EAMC9002
        request: EAIV9010
        assign-to: EAIV9011

# The sites page: the list, then the first site opened.
- name-code: EALC9012
  name: Load Sites
  context:
    steps:
      - command: mesh-invoke
        capability: EAMC9003
        request: EAIV9012
        assign-to: EAIV9013
      - command: mesh-invoke
        capability: EAMC9004
        request: EAIV9014
        assign-to: EAIV9015

# Open one site from the list.
- name-code: EALC9013
  name: Open Site
  context:
    expects:
      - id: ELVT1011
    steps:
      - command: set-map-value
        target-map: EAIV9014
        key: EAMVT9020
        value: id
      - command: mesh-invoke
        capability: EAMC9004
        request: EAIV9014
        assign-to: EAIV9015

# Add the typed domain to the open site.
- name-code: EALC9014
  name: Add Domain
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9017
        key: EAMVT9029
        value: EAIV9015.EAMVT9028
      - command: set-map-value
        target-map: EAIV9017
        key: EAMVT9030
        value: EAIV9016
      - command: set
        target: EAIV9016
        value: ""
      - command: mesh-invoke
        capability: EAMC9005
        request: EAIV9017
        assign-to: EAIV9015

# Pick a domain in the list.
- name-code: EALC9015
  name: Pick Domain
  context:
    expects:
      - id: ELVT1011
    steps:
      - command: set
        target: EAIV9018
        value: id

# Remove the picked domain.
- name-code: EALC9016
  name: Remove Domain
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9017
        key: EAMVT9029
        value: EAIV9015.EAMVT9028
      - command: set-map-value
        target-map: EAIV9017
        key: EAMVT9030
        value: EAIV9018
      - command: mesh-invoke
        capability: EAMC9006
        request: EAIV9017
        assign-to: EAIV9015

# A new deploy token for the open site (for CI); shown once in the publish text.
- name-code: EALC9017
  name: New Deploy Token
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9014
        key: EAMVT9020
        value: EAIV9015.EAMVT9028
      - command: mesh-invoke
        capability: EAMC9007
        request: EAIV9014
        assign-to: EAIV9015

# Set the open site's monthly limit.
- name-code: EALC9018
  name: Set Site Cap
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9020
        key: EAMVT9032
        value: EAIV9015.EAMVT9028
      - command: set-map-value
        target-map: EAIV9020
        key: EAMVT9033
        value: EAIV9019
      - command: mesh-invoke
        capability: EAMC9008
        request: EAIV9020
        assign-to: EAIV9015

# Roll the open site back to its previous version.
- name-code: EALC9019
  name: Roll Back Site
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9014
        key: EAMVT9020
        value: EAIV9015.EAMVT9028
      - command: mesh-invoke
        capability: EAMC9009
        request: EAIV9014
        assign-to: EAIV9015
