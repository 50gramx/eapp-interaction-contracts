# Load deployments + personas on page appear.
- name-code: EALC9001
  name: Init Page
  context:
    steps:
      - command: platform-invoke
        handler: epn.agent.personas
        assign-to: EAIV9002
      - command: mesh-invoke
        capability: EAMC9001
        request: EAIV9008
        assign-to: EAIV9009
      # Last: an app without this handler (before build 662) still loads the rest.
      - command: platform-invoke
        handler: epn.grams.list
        assign-to: EAIV9027

# Return the operator ID TextEditingController.
- name-code: EALC9002
  name: Get Install Controller
  context:
    returns:
      type: ELVT1001
    steps:
      - command: return
        value: EAIV9003

# Return the deployment ID TextEditingController.
- name-code: EALC9003
  name: Get Target Controller
  context:
    returns:
      type: ELVT1001
    steps:
      - command: return
        value: EAIV9004

# Install an operator from the operator ID in EAIV9003, or by package CID
# (EAIV9007) if the operator ID field is left blank — resolved via the
# marketplace package distributor on the daemon side.
- name-code: EALC9004
  name: Install Operator
  context:
    steps:
      - command: platform-invoke
        handler: epn.deployments.install
        params:
          operator_id: EAIV9003
          cid: EAIV9007
        assign-to: EAIV9005

# Return the package CID TextEditingController.
- name-code: EALC9008
  name: Get Install CID Controller
  context:
    returns:
      type: ELVT1001
    steps:
      - command: return
        value: EAIV9007

# Spin up the deployment ID in EAIV9004.
- name-code: EALC9005
  name: Spin Up
  context:
    steps:
      - command: platform-invoke
        handler: epn.deployments.spinup
        params:
          deployment_id: EAIV9004
        assign-to: EAIV9005

# Spin down the deployment ID in EAIV9004.
- name-code: EALC9006
  name: Spin Down
  context:
    steps:
      - command: platform-invoke
        handler: epn.deployments.spindown
        params:
          deployment_id: EAIV9004
        assign-to: EAIV9005

# Fetch recent logs for the deployment ID in EAIV9004.
- name-code: EALC9007
  name: Fetch Logs
  context:
    steps:
      - command: platform-invoke
        handler: epn.deployments.logs_snapshot
        params:
          deployment_id: EAIV9004
          tail_lines: 50
        assign-to: EAIV9006

# Pre-fill the Target Deployment ID field when a row is tapped in the deployments list.
# The engine extracts the tapped deployment's fields and passes them separately.
- name-code: EALC9009
  name: Select Deployment
  context:
    expects:
      - id: ELVT1007
      - name: ELVT1007
      - status: ELVT1007
      - operator_id: ELVT1007
    steps:
      - command: set-text-controller
        controller: EAIV9004
        value: id

# The board: the same answer, opened on its own page.
- name-code: EALC9010
  name: Load Fleet Board
  context:
    steps:
      - command: mesh-invoke
        capability: EAMC9001
        request: EAIV9008
        assign-to: EAIV9009

# The growth board, loaded each time its page appears.
- name-code: EALC9011
  name: Load Growth Board
  context:
    steps:
      - command: mesh-invoke
        capability: EAMC9002
        request: EAIV9010
        assign-to: EAIV9011

# The sites page: the list, then the first site opened.
- name-code: EALC9012
  name: Load Sites
  context:
    steps:
      - command: mesh-invoke
        capability: EAMC9003
        request: EAIV9012
        assign-to: EAIV9013
      - command: mesh-invoke
        capability: EAMC9004
        request: EAIV9014
        assign-to: EAIV9015

# Open one site from the list.
- name-code: EALC9013
  name: Open Site
  context:
    expects:
      - id: ELVT1011
    steps:
      - command: set-map-value
        target-map: EAIV9014
        key: EAMVT9020
        value: id
      - command: mesh-invoke
        capability: EAMC9004
        request: EAIV9014
        assign-to: EAIV9015
      - command: open-page
        page: EAIP9005
        title: EAIV9015.eamvt9021

# Add the typed domain to the open site.
- name-code: EALC9014
  name: Add Domain
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9017
        key: EAMVT9029
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9017
        key: EAMVT9030
        value: EAIV9016
      - command: set
        target: EAIV9016
        value: ""
      - command: mesh-invoke
        capability: EAMC9005
        request: EAIV9017
        assign-to: EAIV9015

# Pick a domain in the list.
- name-code: EALC9015
  name: Pick Domain
  context:
    expects:
      - id: ELVT1011
    steps:
      - command: set
        target: EAIV9018
        value: id

# Remove the picked domain.
- name-code: EALC9016
  name: Remove Domain
  context:
    steps:
      - command: confirm
        title: Remove this domain?
        message: Visitors to it will stop reaching the site, and its certificate is released. You can add it again later.
        confirm-label: Remove
        destructive: true
      - command: set-map-value
        target-map: EAIV9017
        key: EAMVT9029
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9017
        key: EAMVT9030
        value: EAIV9018
      - command: mesh-invoke
        capability: EAMC9006
        request: EAIV9017
        assign-to: EAIV9015

# A new deploy token for the open site (for CI); shown once in the publish text.
- name-code: EALC9017
  name: New Deploy Token
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9014
        key: EAMVT9020
        value: EAIV9015.eamvt9028
      - command: mesh-invoke
        capability: EAMC9007
        request: EAIV9014
        assign-to: EAIV9015

# Set the open site's monthly limit.
- name-code: EALC9018
  name: Set Site Cap
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9020
        key: EAMVT9032
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9020
        key: EAMVT9033
        value: EAIV9019
      - command: mesh-invoke
        capability: EAMC9008
        request: EAIV9020
        assign-to: EAIV9015

# Roll the open site back to its previous version.
- name-code: EALC9019
  name: Roll Back Site
  context:
    steps:
      - command: confirm
        title: Roll back to the previous version?
        message: Visitors get it within a minute. The version live now is kept, so this can be undone.
        confirm-label: Roll back
      - command: set-map-value
        target-map: EAIV9014
        key: EAMVT9020
        value: EAIV9015.eamvt9028
      - command: mesh-invoke
        capability: EAMC9009
        request: EAIV9014
        assign-to: EAIV9015

# Create a site: the gram makes its name, a deploy token, and the commands to publish.
- name-code: EALC9020
  name: Create Site
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9042
        value: ""
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9043
        value: create
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9044
        value: EAIV9022
      - command: mesh-invoke
        capability: EAMC9010
        request: EAIV9021
        assign-to: EAIV9015
      - command: set
        target: EAIV9022
        value: ""
      - command: mesh-invoke
        capability: EAMC9003
        request: EAIV9012
        assign-to: EAIV9013
      - command: open-page
        page: EAIP9005
        title: EAIV9015.eamvt9021

# Pick a version in the list, then confirm rolling back to it.
- name-code: EALC9021
  name: Roll Back To Version
  context:
    expects:
      - id: ELVT1011
    steps:
      - command: set
        target: EAIV9023
        value: id
      - command: confirm
        title: Make this version live?
        message: Visitors get this version within a minute. The version live now is kept, so this can be undone.
        confirm-label: Make it live
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9042
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9043
        value: rollback-to
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9044
        value: EAIV9023
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9045
        value: ""
      - command: mesh-invoke
        capability: EAMC9010
        request: EAIV9021
        assign-to: EAIV9015
      - command: notify
        text: EAIV9015.eamvt9040

# Pick a preview in the list.
- name-code: EALC9022
  name: Pick Preview
  context:
    expects:
      - id: ELVT1011
    steps:
      - command: set
        target: EAIV9024
        value: id

# Make the picked preview the live site.
- name-code: EALC9023
  name: Promote Preview
  context:
    steps:
      - command: confirm
        title: Make this preview the live site?
        message: Its files become the live version; the version live now is kept for rollback.
        confirm-label: Make it live
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9042
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9043
        value: promote-preview
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9044
        value: EAIV9024
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9045
        value: ""
      - command: mesh-invoke
        capability: EAMC9010
        request: EAIV9021
        assign-to: EAIV9015
      - command: notify
        text: EAIV9015.eamvt9040

# Delete the picked preview.
- name-code: EALC9024
  name: Delete Preview
  context:
    steps:
      - command: confirm
        title: Delete this preview?
        message: Its address stops answering. The live site is not touched.
        confirm-label: Delete
        destructive: true
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9042
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9043
        value: delete-preview
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9044
        value: EAIV9024
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9045
        value: ""
      - command: mesh-invoke
        capability: EAMC9010
        request: EAIV9021
        assign-to: EAIV9015
      - command: notify
        text: EAIV9015.eamvt9040

# A new deploy token for CI (publishes the site and its previews); shown once.
- name-code: EALC9025
  name: New Deployer Token
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9042
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9043
        value: new-token
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9044
        value: EAIV9026
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9045
        value: deployer
      - command: mesh-invoke
        capability: EAMC9010
        request: EAIV9021
        assign-to: EAIV9015
      - command: notify
        text: EAIV9015.eamvt9040

# A new preview-only token (safe for pull requests from forks); shown once.
- name-code: EALC9026
  name: New Preview Token
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9042
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9043
        value: new-token
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9044
        value: EAIV9026
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9045
        value: preview
      - command: mesh-invoke
        capability: EAMC9010
        request: EAIV9021
        assign-to: EAIV9015
      - command: notify
        text: EAIV9015.eamvt9040

# Pick a deploy token in the list (by its label).
- name-code: EALC9027
  name: Pick Token
  context:
    expects:
      - id: ELVT1011
    steps:
      - command: set
        target: EAIV9025
        value: id

# Revoke the picked token.
- name-code: EALC9028
  name: Revoke Token
  context:
    steps:
      - command: confirm
        title: Revoke this token?
        message: Any CI job using it stops being able to publish.
        confirm-label: Revoke
        destructive: true
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9042
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9043
        value: revoke-token
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9044
        value: EAIV9025
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9045
        value: ""
      - command: mesh-invoke
        capability: EAMC9010
        request: EAIV9021
        assign-to: EAIV9015
      - command: notify
        text: EAIV9015.eamvt9040

# Check the picked domain now: proof, pointing, certificate, serving.
- name-code: EALC9029
  name: Check Domain
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9042
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9043
        value: check-domain
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9044
        value: EAIV9018
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9045
        value: ""
      - command: mesh-invoke
        capability: EAMC9010
        request: EAIV9021
        assign-to: EAIV9015
      - command: notify
        text: EAIV9015.eamvt9040

# Pause the site (visitors see a paused notice) until resumed.
- name-code: EALC9030
  name: Pause Site
  context:
    steps:
      - command: confirm
        title: Pause this site?
        message: Every address of it answers "paused" until you resume it.
        confirm-label: Pause
        destructive: true
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9042
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9043
        value: pause
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9044
        value: ""
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9045
        value: ""
      - command: mesh-invoke
        capability: EAMC9010
        request: EAIV9021
        assign-to: EAIV9015
      - command: notify
        text: EAIV9015.eamvt9040

# Resume a paused site.
- name-code: EALC9031
  name: Resume Site
  context:
    steps:
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9042
        value: EAIV9015.eamvt9028
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9043
        value: resume
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9044
        value: ""
      - command: set-map-value
        target-map: EAIV9021
        key: EAMVT9045
        value: ""
      - command: mesh-invoke
        capability: EAMC9010
        request: EAIV9021
        assign-to: EAIV9015
      - command: notify
        text: EAIV9015.eamvt9040

# Copy the tapped value (an address, a DNS record value, a command).
- name-code: EALC9032
  name: Copy Value
  context:
    expects:
      - id: ELVT1011
    steps:
      - command: copy
        value: id
        notice: Copied

# Copy the publish instructions.
- name-code: EALC9033
  name: Copy Publish
  context:
    steps:
      - command: copy
        value: EAIV9015.eamvt9031
        notice: Copied

# Open the Operators board page.
- name-code: EALC9034
  name: Open Operators board
  context:
    steps:
      - command: open-page
        page: EAIP9002
        title: Operators board

# Open the Growth page.
- name-code: EALC9035
  name: Open Growth
  context:
    steps:
      - command: open-page
        page: EAIP9003
        title: Growth

# Open the Sites page.
- name-code: EALC9036
  name: Open Sites
  context:
    steps:
      - command: open-page
        page: EAIP9004
        title: Sites

# Look at one of the person's grams: every page of the app then shows that
# gram's sites, operators, meters and wallet (the gram relays its doors).
- name-code: EALC9037
  name: Look At Gram
  context:
    expects:
      - id: ELVT1011
    steps:
      - command: platform-invoke
        handler: epn.grams.view
        params:
          gram: id
        assign-to: EAIV9027
      - command: mesh-invoke
        capability: EAMC9001
        request: EAIV9008
        assign-to: EAIV9009
