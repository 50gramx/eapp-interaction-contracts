- name-code: EAMC6002
  name: Mesh Chat
  mesh:
    context: discover
    method: EAMC6002
    expects: EAMV6001
    returns: EAMV6002

# EAMC6003 - Mesh Chat Stream
#
# The same turn as EAMC6002, watched while it runs.
#
# EAMC6002 is unary: the daemon streams internally (tokens, tool calls, tool
# results, reasoning all arrive as callbacks) and then hands back ONE EAMV6002
# at the end. On the machine that is tolerable, because whoever asked is sitting
# in front of it. It stops being tolerable the moment the asker is on another
# device: a turn on a small local engine takes minutes, and every one of those
# minutes is a blank screen.
#
# So this is the same request and the same response shape, declared
# server-streaming, and the daemon emits an EAMV6002 snapshot per step instead
# of one at the end. Nothing new is invented to carry progress — a partial turn
# is just a turn whose text is shorter and whose activity list is still growing,
# which is exactly what EAMV6002 already describes.
#
# WHY A SECOND CODE RATHER THAN CHANGING EAMC6002. Changing `returns` to
# `returning` changes the generated signature in every language domain at once,
# so epn-daemon and eapp would have to land together or chat breaks between
# them. A new code lets each consumer move when it is ready, and EAMC6002
# retires when nothing calls it.
- name-code: EAMC6003
  name: Mesh Chat Stream
  mesh:
    context: discover
    method: EAMC6003
    expects: EAMV6001
    returning: EAMV6002
    # The engine binds a capability as a stream only on a stream flag;
    # without it the app collected every snapshot into one list at the end,
    # so the reply never showed until the chat was reopened.
    stream: true

# EAMC6004 - Get Receipt
#
# Opens one signed receipt a reply's step names (EAMVT6023 receipt_id), for the
# receipt panel. Read-only: it shows the receipt and re-checks its signature.
- name-code: EAMC6004
  name: Get Receipt
  mesh:
    context: discover
    method: EAMC6004
    expects: EAMV6007
    returns: EAMV6008

# -- EVERY CHAT, RESUMABLE; EVERY QUEUE, BESIDE THE CHAT ---------------------
#
# The app read chat history, runs and approvals straight off the gram's disk
# through platform handlers: only the newest conversation came back, so there
# was no list of chats and no way to resume one, and nothing another gram did
# could ever show. These three read the same things from the gram, through
# the contract, keyed by conversation -- so each run, approval and specialist
# request is shown with the chat it came from.

# EAMC6005 - List Chats: every conversation this gram holds, newest first,
# each with the home-gramx thread it lives in.
- name-code: EAMC6005
  name: List Chats
  mesh:
    context: discover
    method: EAMC6005
    expects: EAMV6009
    returns: EAMV6010

# EAMC6006 - Open Chat: one conversation's messages, to resume it. An empty
# conversation_id opens the most recent one.
- name-code: EAMC6006
  name: Open Chat
  mesh:
    context: discover
    method: EAMC6006
    expects: EAMV6011
    returns: EAMV6012

# EAMC6007 - Chat Activity: the work a conversation started -- durable runs
# and their plans, approvals (decided ones too), specialist requests to the
# foundation -- each with its status. An empty conversation_id is everything.
- name-code: EAMC6007
  name: Chat Activity
  mesh:
    context: discover
    method: EAMC6007
    expects: EAMV6013
    returns: EAMV6014
